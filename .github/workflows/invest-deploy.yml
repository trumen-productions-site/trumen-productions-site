# The investor page's deployments to Cloudflare Pages.
#
# Staging: every push to main deploys the staging build (ribbon on, pending
# tokens visible, gates ignored) to the `staging` branch of the Pages
# project, which sits behind Cloudflare Access. Runs only when the
# Cloudflare secrets are configured, so the repository works without them.
#
# Production: manual only. Runs the gate scripts, then `npm run build:prod`,
# which refuses to produce an artefact unless every gate is signed and no
# term is pending. Only then does anything deploy to the `production` branch.
#
# Secrets: CLOUDFLARE_API_TOKEN (Pages:Edit, D1:Edit), CLOUDFLARE_ACCOUNT_ID.
# Everything the Functions need at runtime is a Pages secret, set once with
# `wrangler pages secret put` — see docs/invest/RUNBOOK.md.

name: Investor page — deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'staging or production'
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  deployments: write

concurrency:
  group: invest-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy staging
    if: github.event_name == 'push' || github.event.inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: invest-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and test (staging)
        run: npm test

      - name: Deploy to Cloudflare Pages (staging)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 d1 migrations apply ce_invest --remote
          npx --yes wrangler@3 pages deploy dist --project-name trumen-invest --branch staging --commit-dirty=true

      - name: No Cloudflare secrets — skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "CLOUDFLARE_API_TOKEN is not set; built and tested, nothing deployed."

  production:
    name: Deploy production (gated)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: invest-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: GATE-01 — every required gate signed
        run: node scripts/check-gates.mjs

      - name: Full test suite
        run: npm test

      - name: GATE-02/03 + lints — production build
        run: npm run build:prod

      - name: GATE-02 — no pending token survived
        run: node scripts/check-pending.mjs dist

      - name: LINT — forbidden strings, canon, names, required text
        run: node scripts/check-forbidden.mjs dist

      - name: SRC-01 — every comparable source answers
        run: node scripts/check-sources.mjs

      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required for production"; exit 1; }
          npx --yes wrangler@3 d1 migrations apply ce_invest --remote
          npx --yes wrangler@3 pages deploy dist --project-name trumen-invest --branch production --commit-dirty=true
